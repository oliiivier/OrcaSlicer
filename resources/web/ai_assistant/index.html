<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Assistant</title>
  <link rel="stylesheet" href="assistant.css">
</head>
<body>
  <header>
    <h1>AI Assistant</h1>
    <button id="toggle-settings" type="button" title="Settings">⚙</button>
  </header>

  <section id="settings" hidden>
    <label>Provider
      <select id="provider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai_compatible">OpenAI-compatible (OpenAI, Ollama, LM Studio…)</option>
      </select>
    </label>
    <label>Endpoint <input id="endpoint" type="url" placeholder="Provider default"></label>
    <label>Model <input id="model" type="text" placeholder="Provider default"></label>
    <label>API key <input id="api_key" type="password" autocomplete="off"></label>
    <button id="save-settings" type="button">Save</button>
  </section>

  <main id="messages" aria-live="polite"></main>

  <form id="composer">
    <textarea id="prompt" rows="3" placeholder="Ask about your project or settings…"></textarea>
    <button type="submit">Send</button>
  </form>

  <script src="assistant.js"></script>
</body>
</html>
