# Fork-only workflow: keeps `main` identical to Snapmaker/OrcaSlicer and proposes
# the merge of upstream into the fork branch (`ai-assistant`) as a pull request.
#
# Requires a FORK_SYNC_TOKEN secret (fine-grained PAT: contents, pull-requests,
# issues and workflows write). GITHUB_TOKEN cannot push upstream commits that touch
# .github/workflows, and PRs it opens do not trigger the build checks.
name: Fork - sync upstream

on:
  schedule:
    - cron: "0 5 * * 1" # every Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'Snapmaker/OrcaSlicer'
    runs-on: ubuntu-latest
    env:
      UPSTREAM: https://github.com/Snapmaker/OrcaSlicer.git
      FORK_BRANCH: ai-assistant
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main

      - name: Mirror upstream/main to main
        run: git push origin upstream/main:refs/heads/main

      - name: Merge upstream into a sync branch
        id: merge
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            echo "status=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/upstream-$(date -u +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git switch -c "$branch"
          if git merge --no-edit upstream/main; then
            git push --force origin "$branch"
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > conflicts.txt
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.merge.outputs.status == 'merged'
        run: |
          branch="${{ steps.merge.outputs.branch }}"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create --base "$FORK_BRANCH" --head "$branch" \
              --title "Sync upstream ($(date -u +%Y-%m-%d))" \
              --body "Automatic merge of \`Snapmaker/OrcaSlicer@main\` into \`$FORK_BRANCH\`. Check the build before merging (merge commit, no squash)."
          fi

      - name: Report conflicts
        if: steps.merge.outputs.status == 'conflict'
        run: |
          {
            echo "Merging \`Snapmaker/OrcaSlicer@main\` into \`$FORK_BRANCH\` conflicts on:"
            echo
            sed 's/^/- `/; s/$/`/' conflicts.txt
            echo
            echo "Resolve locally, see FORK.md."
          } > body.md
          gh issue create --title "Upstream sync conflict ($(date -u +%Y-%m-%d))" --body-file body.md
