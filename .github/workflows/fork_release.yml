# Fork-only (see FORK.md): builds the slicer for Linux, Windows and macOS with the upstream
# build workflows, then publishes the packages as a pre-release of this fork. Started by
# hand only: Actions -> Fork release -> Run workflow, or `gh workflow run fork_release.yml`.
name: Fork release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v2.4.1-ai.1'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
          # macOS left out for now: the macos-15 arm64 runners were never available.
          # - os: macos-15
          #   arch: arm64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      build-deps-only: false
    secrets: inherit

  # pacman package (Arch Linux, CachyOS): the contents of the Ubuntu AppImage, as the local
  # scripts/fork/arch/build-package.sh does with build/package.
  pacman:
    name: Package for Arch Linux
    needs: [build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install the tools
        run: pacman -Syu --noconfirm --needed git python

      # Full history: the package version counts the commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download the AppImage
        uses: actions/download-artifact@v4
        with:
          pattern: Snapmaker_Orca_Linux_ubuntu_*
          path: appimage

      - name: Build the package
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find appimage -name '*.AppImage' | head -n1)
          [ -n "$appimage" ] || { echo "No AppImage was built" >&2; exit 1; }
          chmod +x "$appimage"
          # makepkg refuses to run as root.
          useradd -m builder
          git config --system --add safe.directory '*'
          chown -R builder "$GITHUB_WORKSPACE"
          mkdir -p pacman && chown builder pacman
          # The runtime libraries are dependencies of the package, not needed to build it.
          sudo -u builder env PKGDEST="$GITHUB_WORKSPACE/pacman" MAKEPKG_ARGS=--nodeps \
            scripts/fork/arch/build-package.sh "$appimage"

      - uses: actions/upload-artifact@v4
        with:
          name: Snapmaker_Orca_Linux_pacman
          path: pacman/*.pkg.tar.zst

  release:
    name: Publish the pre-release
    needs: [build, pacman]
    # The upstream workflows end with a Sentry upload that fails without its secrets:
    # publish whatever packages were built.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: Snapmaker_Orca_{Linux,Mac,Windows}*
          path: packages

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          shopt -s nullglob
          for dir in packages/*/; do
            name=$(basename "$dir")
            if [[ "$name" == *_portable ]]; then
              (cd "$dir" && zip -qr "$GITHUB_WORKSPACE/assets/$name.zip" .)
            else
              cp "$dir"* assets/
            fi
          done
          ls -l assets
          if [ -z "$(ls -A assets)" ]; then
            echo "No package was built" >&2
            exit 1
          fi

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --prerelease --target "$GITHUB_SHA" \
              --title "Snapmaker Orca + AI assistant $TAG" --notes-file scripts/fork/release-notes.md
          fi
